<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marketing · Estado de Situación — Abril 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#161618;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'DM Sans',Arial,sans-serif;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(135deg,rgba(241,94,55,0.03) 25%,transparent 25%),
      linear-gradient(225deg,rgba(241,94,55,0.03) 25%,transparent 25%),
      linear-gradient(45deg,rgba(241,94,55,0.03) 25%,transparent 25%),
      linear-gradient(315deg,rgba(241,94,55,0.03) 25%,transparent 25%);
    background-size:80px 80px;
    pointer-events:none;
    z-index:0;
  }
  .lock-wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    padding:24px;
  }
  .lock-box{
    background:#1C1D1E;
    border:1px solid rgba(241,94,55,0.2);
    border-radius:16px;
    padding:40px 36px;
    text-align:center;
    box-shadow:0 24px 64px rgba(0,0,0,0.5);
  }
  .lock-logo{
    width:44px;height:44px;
    background:#F15E37;
    border-radius:10px;
    display:inline-flex;
    align-items:center;justify-content:center;
    font-weight:700;font-size:16px;color:white;
    letter-spacing:0.5px;
    margin-bottom:24px;
  }
  .lock-title{
    font-size:20px;font-weight:600;
    color:#FCFCFA;
    margin-bottom:6px;
  }
  .lock-sub{
    font-size:13px;color:#6D7378;
    margin-bottom:28px;
    line-height:1.5;
  }
  .lock-input-wrap{position:relative;margin-bottom:16px;}
  .lock-input{
    width:100%;
    background:#26272B;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    padding:14px 48px 14px 16px;
    font-size:15px;
    color:#FCFCFA;
    font-family:'DM Sans',Arial,sans-serif;
    outline:none;
    transition:border-color 0.2s;
    letter-spacing:0.5px;
  }
  .lock-input:focus{border-color:rgba(241,94,55,0.5);}
  .lock-input.error{border-color:rgba(239,68,68,0.6);animation:shake 0.4s ease;}
  .toggle-pw{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;
    color:#6D7378;font-size:18px;padding:2px;
    transition:color 0.2s;
  }
  .toggle-pw:hover{color:#D9D9D4;}
  .lock-btn{
    width:100%;
    background:#F15E37;
    color:white;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:15px;font-weight:600;
    font-family:'DM Sans',Arial,sans-serif;
    cursor:pointer;
    transition:opacity 0.2s,transform 0.15s;
    letter-spacing:0.3px;
  }
  .lock-btn:hover{opacity:0.88;transform:translateY(-1px);}
  .lock-btn:active{transform:translateY(0);}
  .lock-error{
    margin-top:14px;
    font-size:13px;
    color:#f87171;
    display:none;
  }
  .lock-error.show{display:block;}
  .lock-footer{
    margin-top:28px;
    font-size:11px;
    color:#6D7378;
    letter-spacing:0.5px;
    border-top:1px solid rgba(255,255,255,0.05);
    padding-top:20px;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }
</style>
</head>
<body>
<div class="lock-wrap">
  <div class="lock-box">
    <div class="lock-logo">VU</div>
    <div class="lock-title">Documento restringido</div>
    <div class="lock-sub">Marketing · Estado de Situación · Abril 2026<br/>Ingresá la contraseña para continuar.</div>
    <div class="lock-input-wrap">
      <input type="password" class="lock-input" id="pw" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()"/>
      <button class="toggle-pw" onclick="togglePw()" title="Mostrar/ocultar">&#128065;</button>
    </div>
    <button class="lock-btn" onclick="unlock()">Acceder</button>
    <div class="lock-error" id="err">Contraseña incorrecta. Verificá e intentá de nuevo.</div>
    <div class="lock-footer">VU Inc. · Contenido confidencial · vusecurity.com</div>
  </div>
</div>

function togglePw(){
  var inp = document.getElementById('pw');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
function unlock(){
  var pw = document.getElementById('pw').value;
  var inp = document.getElementById('pw');
  var err = document.getElementById('err');
  if(!pw){ inp.classList.add('error'); setTimeout(function(){ inp.classList.remove('error'); },600); return; }
  try {
    var decrypted = CryptoJS.AES.decrypt(PAYLOAD, pw);
    var html = decrypted.toString(CryptoJS.enc.Utf8);
    if(!html || html.length < 100 || html.indexOf('<!DOCTYPE html') === -1){
      throw new Error('bad');
    }
    document.open();
    document.write(html);
    document.close();
  } catch(e){
    inp.classList.add('error');
    inp.value = '';
    err.classList.add('show');
    setTimeout(function(){ inp.classList.remove('error'); err.classList.remove('show'); }, 3000);
  }
}
